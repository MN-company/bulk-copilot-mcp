name: bulk-copilot
services:
  bulk-mcp:
    build: .
    image: bulk-copilot-mcp:0.2.0
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3789:3789"
    volumes:
      # Session cookies written by `npm run login` on the host.
      - ${BULK_HOST_DATA_DIR:-~/.bulk-copilot}:/data
      # SQLite lives on a Docker volume: WAL does not work on Windows bind mounts.
      - bulk_state:/state
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3789/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  bulk_state:
